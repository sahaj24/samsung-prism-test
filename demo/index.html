<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f4ef"><title>Reprise</title>
<style>
:root{color-scheme:light;--ink:#292e2b;--muted:#656d67;--line:#dce0d8;--green:#315c49;--paper:#fffefa}*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:var(--ink);font:14px/1.45 system-ui,sans-serif}.shell{max-width:1320px;margin:auto;padding:24px}.topbar,.controls,.connection,.section-head,.plan-footer,.service-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.topbar{justify-content:space-between;margin-bottom:20px}.brand{font-size:27px;font-weight:650;letter-spacing:-1px}.status{color:var(--green)}h1,h2,h3,p{margin:0}h1,h2{font-size:17px;font-weight:600}h3{font-size:15px}.connection{font-size:13px;color:var(--muted);margin-bottom:12px}.connection details{margin-left:auto}.service-status{font-size:12px;color:var(--muted);gap:16px;margin-bottom:12px}.service-status [data-state="connected"]{color:var(--green)}button,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}.controls{margin-bottom:16px}#timer{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}.columns{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}.section-head{padding:14px 18px;border-bottom:1px solid var(--line);justify-content:space-between}.history{list-style:none;margin:0;padding:0 18px;overflow:auto;overflow-wrap:anywhere;max-height:58vh;min-height:200px}.entry{padding:10px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.entry header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px;font-size:13px}.entry time,.live-entry time{font-size:11px;color:var(--muted);white-space:nowrap}.entry p{white-space:pre-wrap}.entry.user strong{color:var(--green)}.entry details{font-size:12px;margin-top:7px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;margin:8px 0}.chat{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}input{min-width:0;flex:1;font:inherit;background:transparent;border:1px solid var(--line);padding:10px;border-radius:8px}#notice{color:#8a3828;margin-bottom:12px}#notice:empty{display:none}.live-entry{margin:0 18px;padding:10px 0;white-space:pre-wrap;border-top:1px solid var(--line)}.live-entry time{float:right;margin-left:12px}.live-entry p{overflow-wrap:anywhere}.live-entry:first-child p{color:var(--green)}#planCard{border-top:1px solid var(--line)}.plan-list{padding:0 18px;margin:0;list-style:none}.plan-item{border-bottom:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere}.plan-item strong{display:block}.plan-item p{white-space:pre-wrap;font-size:13px}.plan-kind,.plan-state{font-size:12px;color:var(--muted)}.plan-state{float:right}.plan-footer{padding:12px 18px}.plan-footer p{font-size:12px;color:var(--muted)}.plan-footer:has(button[hidden]):has(p:empty){display:none}a{color:var(--green)}[hidden]{display:none!important}@media(max-width:760px){.shell{padding:16px}.columns{grid-template-columns:minmax(0,1fr);gap:16px}.connection details{margin-left:0}.controls{gap:8px}button{padding:9px 11px}.history{min-height:120px;max-height:45vh}.chat,.section-head{padding:12px 14px}.history,.plan-list{padding:0 14px}.live-entry{margin:0 14px}.topbar{margin-bottom:16px}}
</style>
</head>
<body><div class="shell">
<header class="topbar"><span class="brand">reprise</span><span id="status" class="status" role="status">Not connected</span></header>
<div class="connection"><span id="googleStatus">Checking Google…</span><a id="connectGoogle" href="/google/connect" target="_blank" rel="noopener">Connect Google ↗</a><details><summary>Session settings</summary><label>Tools <select id="mode"><option value="productivity">Google Workspace</option><option value="benchmark">Simulated tools</option></select></label></details></div>
<div class="service-status" aria-label="Voice connections"><span id="livekitStatus" role="status">LiveKit · disconnected</span><span id="geminiStatus" role="status">Gemini · disconnected</span></div>
<main><div class="controls"><button id="start" class="primary">Start conversation</button><button id="mute" disabled>Mute microphone</button><button id="end" disabled>End</button><time id="timer">00:00</time></div>
<p id="notice" role="alert"></p>
<div class="columns">
<section class="panel" aria-label="Conversation"><div class="section-head"><h1>Conversation</h1></div><ol id="conversation" class="history" aria-label="Conversation history"></ol><div aria-label="Live transcript"><div id="userLiveRow" class="live-entry" hidden><time id="userLiveTime"></time><p id="partial" role="status"></p></div><div id="agentLiveRow" class="live-entry" hidden><time id="agentLiveTime"></time><p id="agentPartial" role="status"></p></div></div><form id="chat" class="chat"><input id="text" aria-label="Message" placeholder="Message" disabled><button id="send" disabled>Send</button></form></section>
<section class="panel" aria-label="Actions and status"><div class="section-head"><h2>Actions &amp; Status</h2></div><ol id="activity" class="history" aria-label="Action history"></ol>
<section id="planCard" hidden><div class="section-head"><h3 id="planTitle">Plan</h3><span id="planStatus"></span></div><ol class="plan-list" id="planActions"></ol><div class="plan-footer"><button class="primary" id="confirmPlan" disabled>Confirm</button><p id="planNote"></p></div></section>
</section></div>
</main>
</div><script src="/vendor/livekit-client.umd.js"></script><script src="/app.js?v=20261020-workspace"></script></body></html>
