[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reprise-voice"
version = "0.1.0"
description = "Interruptible Gemini Live agent with versioned tool execution"
requires-python = ">=3.10,<3.13"
dependencies = [
  "livekit-agents[google,silero]>=1.3,<2",
  "google-genai>=1.50",
  "python-dotenv>=1.0",
  "jsonschema>=4.23",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "numpy>=1.26",
  "soundfile>=0.13",
  "gdown>=5.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[project.scripts]
reprise = "reprise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reprise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
